services:
  db:
    image: postgres:17
    env_file: .env
    # 127.0.0.1 = reachable from this Mac only, not from other devices on your network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app  # live code, so --reload sees your edits
      - ./data:/data:ro  # real CSVs, read-only
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:26
    working_dir: /app
    env_file: .env
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      # Linux-only copies, so the container never uses your Mac's builds.
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend

  # --- Demo: the same app on fake data, at http://localhost:3001 ---------------------------
  # Start with:  docker compose --profile demo up -d
  # Fresh data:  docker compose exec backend-demo python -m app.demo --reset
  # It has its own database (finance_demo, same Postgres), so it never touches real data,
  # and its Plaid is sandbox-only, so it can't connect a real bank.
  backend-demo:
    profiles: [demo]
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/finance_demo
      PLAID_ENV: sandbox
      FRONTEND_ORIGINS: http://localhost:3001
      DATA_DIR: /nonexistent  # no personal category rules from data/
    # app.demo creates and migrates the database, and seeds it the first time.
    command: >
      sh -c "python -m app.demo &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend-demo:
    profiles: [demo]
    image: node:26
    working_dir: /app
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./frontend:/app
      - frontend_demo_node_modules:/app/node_modules
      - frontend_demo_next:/app/.next
    depends_on:
      - backend-demo

volumes:
  pgdata:
  frontend_node_modules:
  frontend_next:
  frontend_demo_node_modules:
  frontend_demo_next:
