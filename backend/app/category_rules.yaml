# Category rules: "if the bank's description contains this, use this category".
#
# - Matching ignores case and only matches whole words: TEA matches "HERO TEA" but not "STEAM".
# - End a pattern with * to also match longer words: DOORDASH* matches "DD/DOORDASHYOSUSHI".
# - If several patterns match, the longest one wins: "ANNUAL FEE REBATE" beats "ANNUAL FEE".
# - Personal rules (local places) go in data/category_rules.yaml, which is gitignored and
#   wins ties against this file.
# - After editing, re-apply with POST /transactions/recategorize (or just import again).
#   Categories you set by hand are never overwritten.

